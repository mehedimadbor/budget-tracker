<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Manager App</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
}
button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: black;
  color: white;
  font-weight: bold;
}
.row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  border-bottom: 1px solid #eee;
  padding: 6px 0;
}
.title {
  font-size: 20px;
  font-weight: bold;
}
.small {
  font-size: 13px;
  color: #444;
}
</style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="title">Money Manager</div>
    <div class="small" id="balance">Main Balance: 0 tk</div>
    <div class="small" id="savings">Savings: 0 tk</div>
  </div>

  <div class="card">
    <input id="categoryInput" placeholder="Add Category" />
    <button onclick="addCategory()">Add Category</button>
    <select id="categorySelect"></select>
  </div>

  <div class="card">
    <input id="amount" type="number" placeholder="Amount" />
    <select id="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

  <div class="card">
    <input id="saveAmount" type="number" placeholder="Transfer to Savings" />
    <button onclick="toSavings()">Send to Savings</button>

    <input id="withdrawAmount" type="number" placeholder="Withdraw Savings" />
    <button onclick="fromSavings()">Withdraw</button>
  </div>

  <div class="card">
    <div class="title">Transactions</div>
    <div id="list"></div>
  </div>

</div>

<script>
let transactions = [];
let categories = [];
let savings = 0;

function updateUI() {
  let income = transactions.filter(t => t.type === 'income').reduce((a,b)=>a+Number(b.amount),0);
  let expense = transactions.filter(t => t.type === 'expense').reduce((a,b)=>a+Number(b.amount),0);
  let balance = income - expense;

  document.getElementById('balance').innerText = "Main Balance: " + balance + " tk";
  document.getElementById('savings').innerText = "Savings: " + savings + " tk";

  let list = document.getElementById('list');
  list.innerHTML = '';

  transactions.slice().reverse().forEach(t => {
    let div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<span>${t.category}</span><span>${t.type === 'income' ? '+' : '-'}${t.amount}</span>`;
    list.appendChild(div);
  });

  let select = document.getElementById('categorySelect');
  select.innerHTML = '<option value="">Select Category</option>';
  categories.forEach(c => {
    let opt = document.createElement('option');
    opt.value = c;
    opt.innerText = c;
    select.appendChild(opt);
  });
}

function addCategory() {
  let val = document.getElementById('categoryInput').value.trim();
  if(val && !categories.includes(val)) {
    categories.push(val);
    document.getElementById('categoryInput').value = '';
    updateUI();
  }
}

function addTransaction() {
  let amount = Number(document.getElementById('amount').value);
  let type = document.getElementById('type').value;
  let cat = document.getElementById('categorySelect').value;

  if(!amount || !cat) return;

  transactions.push({amount, type, category: cat});

  document.getElementById('amount').value = '';
  updateUI();
}

function toSavings() {
  let amt = Number(document.getElementById('saveAmount').value);
  if(!amt) return;

  savings += amt;
  transactions.push({amount: amt, type: 'expense', category: 'Savings Transfer'});

  document.getElementById('saveAmount').value = '';
  updateUI();
}

function fromSavings() {
  let amt = Number(document.getElementById('withdrawAmount').value);
  if(!amt) return;

  savings -= amt;
  transactions.push({amount: amt, type: 'income', category: 'Savings Withdraw'});

  document.getElementById('withdrawAmount').value = '';
  updateUI();
}

updateUI();
</script>

</body>
</html>
