<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Manager App</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}
.container{max-width:650px;margin:auto;padding:12px}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:10px;border:0;border-radius:6px;background:#000;color:#fff;font-weight:bold}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:6px 0;font-size:13px}
.title{font-size:18px;font-weight:bold}
.small{font-size:13px;color:#444}
.danger{background:red !important;color:white !important}
</style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="title">Money Manager</div>
    <div class="small" id="balance">Main Balance: 0 tk</div>
    <div class="small" id="savings">Savings: 0 tk</div>
    <div class="small" id="loan">Total Loan: 0 tk</div>
  </div>

  <div class="card">
    <input type="month" id="monthFilter" onchange="updateUI()" />
  </div>

  <div class="card">
    <input id="categoryInput" placeholder="Add Category" />
    <button onclick="addCategory()">Add Category</button>
    <select id="categorySelect"></select>
  </div>

  <div class="card">
    <input id="amount" type="number" placeholder="Amount" />
    <select id="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

  <div class="card">
    <input id="saveAmount" type="number" placeholder="Send to Savings" />
    <select id="saveCategory"></select>
    <button onclick="toSavings()">Send to Savings</button>

    <input id="withdrawAmount" type="number" placeholder="Withdraw Savings" />
    <button onclick="fromSavings()">Withdraw</button>
  </div>

  <!-- LOAN SECTION -->
  <div class="card">
    <div class="title">Loan Manager</div>

    <input id="loanAmount" type="number" placeholder="Add Loan Amount" />
    <button onclick="addLoan()">Add Loan</button>

    <input id="payLoanAmount" type="number" placeholder="Pay Loan Amount" />
    <button onclick="payLoan()">Pay Loan</button>
  </div>

  <div class="card">
    <div class="title">Category Expense</div>
    <div id="summary"></div>
  </div>

  <div class="card">
    <div class="title">Transactions</div>
    <div id="list"></div>
  </div>

  <div class="card">
    <button class="danger" onclick="clearData()">⚠ CLEAR ALL DATA</button>
  </div>

</div>

<script>
let transactions = JSON.parse(localStorage.getItem('t') || '[]');
let categories = JSON.parse(localStorage.getItem('c') || '[]');
let savings = JSON.parse(localStorage.getItem('s') || '0');
let loan = JSON.parse(localStorage.getItem('l') || '0');

function save(){
  localStorage.setItem('t', JSON.stringify(transactions));
  localStorage.setItem('c', JSON.stringify(categories));
  localStorage.setItem('s', JSON.stringify(savings));
  localStorage.setItem('l', JSON.stringify(loan));
}

function getFiltered(){
  let m = document.getElementById('monthFilter').value;
  if(!m) return transactions;

  let [y,mo] = m.split('-');

  return transactions.filter(t => {
    let d = new Date(t.date);
    return d.getFullYear() == y && (d.getMonth()+1) == mo;
  });
}

function updateUI(){
  let incomeAll = transactions.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
  let expenseAll = transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0);

  document.getElementById('balance').innerText = 'Main Balance: ' + (incomeAll-expenseAll) + ' tk';
  document.getElementById('savings').innerText = 'Savings: ' + savings + ' tk';
  document.getElementById('loan').innerText = 'Total Loan: ' + loan + ' tk';

  let list = document.getElementById('list');
  list.innerHTML = '';

  let f = getFiltered();

  f.slice().reverse().forEach((t)=>{
    let div = document.createElement('div');
    div.className = 'row';
    const realIndex = transactions.findIndex(x => x.date === t.date && x.amount == t.amount && x.category === t.category && x.type === t.type);
    div.innerHTML = `<span>${t.category}</span><span>${t.type==='income'?'+':'-'}${t.amount}</span><button onclick="deleteTransaction(${realIndex})" style="width:auto;padding:4px 8px;font-size:11px;font-weight:bold;background:#dc2626;color:white;border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)">Delete</button>`;
    list.appendChild(div);
  });

  let sel = document.getElementById('categorySelect');
  let sel2 = document.getElementById('saveCategory');
  sel.innerHTML = sel2.innerHTML = '<option value="">Select</option>';

  categories.forEach(c=>{
    sel.innerHTML += `<option>${c}</option>`;
    sel2.innerHTML += `<option>${c}</option>`;
  });

  let sum = {};
  f.forEach(t=>{
    if(t.type==='expense') sum[t.category]=(sum[t.category]||0)+Number(t.amount);
  });

  let s = document.getElementById('summary');
  s.innerHTML = '';

  Object.entries(sum).sort((a,b)=>b[1]-a[1]).forEach(x=>{
    s.innerHTML += `<div class='row'><span>${x[0]}</span><span>${x[1]} tk</span></div>`;
  });
}

function addCategory(){
  let v = document.getElementById('categoryInput').value.trim();
  if(v && !categories.includes(v)) categories.push(v);
  document.getElementById('categoryInput').value='';
  save(); updateUI();
}

function addTransaction(){
  let a = Number(document.getElementById('amount').value);
  let t = document.getElementById('type').value;
  let c = document.getElementById('categorySelect').value;

  if(!a || !c) return;

  transactions.push({amount:a,type:t,category:c,date:new Date()});
  document.getElementById('amount').value='';

  save(); updateUI();
}

function toSavings(){
  let a = Number(document.getElementById('saveAmount').value);
  let c = document.getElementById('saveCategory').value;

  if(!a || !c) return;

  savings += a;
  transactions.push({amount:a,type:'expense',category:'Savings from '+c,date:new Date()});

  document.getElementById('saveAmount').value='';
  save(); updateUI();
}

function fromSavings(){
  let a = Number(document.getElementById('withdrawAmount').value);
  if(!a) return;

  savings -= a;
  transactions.push({amount:a,type:'income',category:'Savings Withdraw',date:new Date()});

  document.getElementById('withdrawAmount').value='';
  save(); updateUI();
}

function addLoan(){
  let a = Number(document.getElementById('loanAmount').value);
  if(!a) return;

  loan += a;
  transactions.push({amount:a,type:'income',category:'Loan Taken',date:new Date()});

  document.getElementById('loanAmount').value='';
  save(); updateUI();
}

function payLoan(){
  let a = Number(document.getElementById('payLoanAmount').value);
  if(!a) return;

  loan -= a;
  if(loan < 0) loan = 0;

  transactions.push({amount:a,type:'expense',category:'Loan Payment',date:new Date()});

  document.getElementById('payLoanAmount').value='';
  save(); updateUI();
}

function deleteTransaction(index){
  let t = transactions[index];
  if(!t) return;

  let ok = confirm('Delete this transaction?');
  if(!ok) return;

  if(t.category === 'Loan Taken'){
    loan -= Number(t.amount);
    if(loan < 0) loan = 0;
  }

  if(t.category === 'Loan Payment'){
    loan += Number(t.amount);
  }

  if(t.category.startsWith('Savings from')){
    savings -= Number(t.amount);
    if(savings < 0) savings = 0;
  }

  if(t.category === 'Savings Withdraw'){
    savings += Number(t.amount);
  }

  transactions.splice(index,1);
  save();
  updateUI();
}

function clearData(){
  let ok = confirm('⚠ Are you sure? This will delete ALL data permanently!');
  if(!ok) return;

  transactions = [];
  categories = [];
  savings = 0;
  loan = 0;

  localStorage.removeItem('t');
  localStorage.removeItem('c');
  localStorage.removeItem('s');
  localStorage.removeItem('l');

  updateUI();
}

updateUI();
</script>

</body>
</html>
